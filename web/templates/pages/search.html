{{define "title"}}Search — vgmss{{end}}
{{define "content"}}
<h1>Search</h1>
<form class="search" hx-get="/search" hx-target="#search-results" hx-trigger="input changed delay:300ms, search">
  <input type="search" name="q" value="{{.Query}}" placeholder="Game title, equipment, track name, notes..." autofocus>
</form>
<div id="search-results">
  {{template "search_results.html" .}}
</div>
{{end}}
