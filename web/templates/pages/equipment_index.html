{{define "title"}}Equipment — vgmss{{end}}
{{define "content"}}
<div class="index-header">
  <h1>Equipment</h1>

<form class="search" hx-get="/equipment" hx-target="#equipment-list" hx-trigger="input changed delay:200ms, search">

<div id="equipment-list">
  {{template "equipment_list" .}}
</div>
{{end}}
